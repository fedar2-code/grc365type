<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Sample</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gravitas+One&family=Young+Serif&display=swap');
        div {
            width: 800px;
            height: 500px;
            background: url("dog-pack.jpg");
            margin: 24px auto;
            background-size: 100%;
        } h1 {
            font-family: 'Gravitas One', cursive;
            color: white;
            text-align: center;
            padding-top: 32px;
            text-shadow: 1px 3px 6px orange;
        } p {
            font: italic 14pt/1.4em 'Young Serif';
            color: white;
            white-space: pre-wrap;
            tab-size: 6;
            text-align: center;
            text-shadow: 1px 3px 6px rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <div>
        <h1> The Dogs and the Fox </h1>
        <p>Some dogs, finding the skin of a lion, began to tear it in pieces
with their teeth.  A Fox, seeing them, said, "If this lion were
alive, you would soon find out that his claws were stronger than
your teeth."</p>
    </div>
</body>
</html>
